plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.19'
	id 'maven-publish'
}

version = '0.3.2-alpha+26.2'
group = 'dev.skyscript'

base {
	archivesName = 'skyscript'
}

// Local deployment target. Override it with -PskyScriptModsDir=... if needed.
def skyScriptModsDir = providers.gradleProperty('skyScriptModsDir')
	.getOrElse('D:/Minecraft/.minecraft/versions/26.2-Fabric 0.19.3/mods')

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Mod Menu 集成（可选依赖，不装 Mod Menu 也不影响）
    compileOnly "com.terraformersmc:modmenu:20.0.1"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

def gameModsDir = file(skyScriptModsDir)

tasks.register('cleanGameMod', Delete) {
	onlyIf { gameModsDir.isDirectory() }
	delete fileTree(gameModsDir) {
		include "${project.base.archivesName.get()}-*.jar"
		exclude '*-sources.jar'
	}
}

afterEvaluate {
	tasks.register('deployGameMod', Copy) {
		dependsOn tasks.named('jar')
		dependsOn tasks.named('cleanGameMod')
		from(tasks.named('jar'))
		into(gameModsDir)
	}

	tasks.named('build') {
		finalizedBy tasks.named('deployGameMod')
	}
}
